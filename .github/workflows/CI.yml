# CI：单个 windows 作业内按改动增量选择用例、并行执行；构建产物按内容哈希缓存跨 run 复用。
name: CI

on:
  push:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.cs'
      - '.github/workflows/**'
      - 'tests/**'
  pull_request:
    branches: ['master']
  workflow_dispatch:

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed paths
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $paths = @()
          if ("${{ github.event_name }}" -eq "pull_request") {
            $paths = @(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>$null)
          } else {
            $before = "${{ github.event.before }}"
            $sha = "${{ github.sha }}"
            if ($before -and $before -ne ("0" * 40)) { $paths = @(git diff --name-only $before $sha 2>$null) }
            if (-not $paths) { $paths = @(git diff --name-only HEAD~1 2>$null) }
          }
          $paths | Where-Object { $_ } | Set-Content -LiteralPath changed.txt -Encoding utf8
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: tests/.cache/builds
          key: ps12exe-builds-${{ hashFiles('ps12exe.ps1','ps12exe.psm1','ps12exe.psd1','exe21sp.ps1','src/*.ps1','src/*.psd1','src/GUI/**','src/Interact/**','src/WebServer/**','src/RuntimePwsh2.0/**','src/locale/**','src/programFrames/**','src/.subrepo/PS2EXE2ps12exe/**') }}
          restore-keys: |
            ps12exe-builds-
      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path changed.txt) { pwsh -NoProfile -File tests/run.ps1 -ChangedPathsFile changed.txt }
          else { pwsh -NoProfile -File tests/run.ps1 -All }
