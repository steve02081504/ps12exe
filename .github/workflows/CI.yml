# CI：用例按改动增量选择并按构建数均衡分片到多个 windows 作业并行；构建产物按组件内容哈希缓存跨 run 复用。
name: CI

on:
  push:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.cs'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tests/**'
  pull_request:
    branches: ['master']
  workflow_dispatch:

# 同一 ref 只保留最新运行，旧的直接取消：避免排队占 runner，也避免手动取消把缓存带没。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    timeout-minutes: 90
    # 用例按构建数贪心均衡到 3 片；分片归属只取决于用例名/构建数，跨 run 稳定，
    # 因此每片用独立缓存键前缀即可各自复用历史构建产物。改这里的分片数时要同步改下面的 -ShardCount。
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Windows speedup
        uses: ./.github/actions/defender-exclusions
      - name: Compute changed paths
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $paths = @()
          if ("${{ github.event_name }}" -eq "pull_request") {
            $paths = @(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>$null)
          } else {
            $before = "${{ github.event.before }}"
            $sha = "${{ github.sha }}"
            if ($before -and $before -ne ("0" * 40)) { $paths = @(git diff --name-only $before $sha 2>$null) }
            if (-not $paths) { $paths = @(git diff --name-only HEAD~1 2>$null) }
          }
          $paths | Where-Object { $_ } | Set-Content -LiteralPath changed.txt -Encoding utf8
      - name: Compute source fingerprint
        id: fingerprint
        shell: pwsh
        run: |
          # 用测试框架自身的源指纹做缓存键，保证与构建缓存键同源，避免手写 hashFiles 列表漂移。
          $fp = pwsh -NoProfile -File tests/run.ps1 -PrintFingerprint | Select-Object -Last 1
          if (-not $fp) { throw '无法计算源码指纹' }
          "value=$("$fp".Trim())" >> $env:GITHUB_OUTPUT
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache/builds
          # 分片放在指纹前，restore-keys 才能用固定前缀「ps12exe-builds-s<片>-」命中该片最近一次缓存。
          key: ps12exe-builds-s${{ matrix.shard }}-${{ steps.fingerprint.outputs.value }}
          restore-keys: |
            ps12exe-builds-s${{ matrix.shard }}-
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: ps12exe-nuget-${{ runner.os }}-${{ hashFiles('src/CoreCompiler.ps1','src/programFrames/**') }}
          restore-keys: |
            ps12exe-nuget-${{ runner.os }}-
      - name: Run tests
        shell: pwsh
        run: |
          # 分片数 3 必须与 strategy.matrix.shard 保持一致。
          $shardArgs = @('-ShardIndex', '${{ matrix.shard }}', '-ShardCount', '3')
          if (Test-Path changed.txt) { pwsh -NoProfile -File tests/run.ps1 -ChangedPathsFile changed.txt @shardArgs }
          else { pwsh -NoProfile -File tests/run.ps1 -All @shardArgs }
      - name: Ensure cache dirs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests/.cache/builds | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE '.nuget/packages') | Out-Null
      # 用 restore/save 拆分 + always()：失败的 run 也要落缓存（旧的 actions/cache 只在成功时保存，
      # 一旦有一个用例红，缓存就永远存不下来，导致每次全量冷构建）。
      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/.cache/builds
          key: ps12exe-builds-s${{ matrix.shard }}-${{ steps.fingerprint.outputs.value }}
      - name: Save NuGet cache
        if: always() && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: ps12exe-nuget-${{ runner.os }}-${{ hashFiles('src/CoreCompiler.ps1','src/programFrames/**') }}
